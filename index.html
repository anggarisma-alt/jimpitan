<!DOCTYPE html>
<html lang="id" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Jimpitan RT — Kas RT, jimpitan ronda, dan iuran warga.">
  <title>Jimpitan RT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Percepat koneksi pertama ke backend & CDN -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css?v=2.3.0" rel="stylesheet">
</head>
<body>
<div class="topbar-prog" id="prog"></div>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-mark logo"><i class="bi bi-wallet2"></i></div>
      <h1 class="h3 mb-1">Jimpitan RT</h1>
      <div class="muted">Kas RT &amp; Jimpitan Ronda</div>
      <div class="login-chips"><span><i class="bi bi-qr-code-scan"></i> Scan QR</span><span><i class="bi bi-cash-coin"></i> Iuran</span><span><i class="bi bi-graph-up-arrow"></i> Laporan</span></div>
    </div>
    <div class="c">
      <form id="loginForm" autocomplete="on" novalidate>
        <div class="mb-3">
          <label class="form-label" for="lgUser">No. rumah / username</label>
          <input class="form-control" id="lgUser" name="username" autocomplete="username" inputmode="text" placeholder="contoh: 12 atau ronda.budi" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="lgPin">PIN</label>
          <div class="pin-wrap">
            <input class="form-control" id="lgPin" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4–8 digit" maxlength="8" required>
            <button type="button" class="icon-btn" id="lgEye" aria-label="Tampilkan PIN"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div id="lgErr" class="insight warn d-none-i" role="alert"><i class="bi bi-exclamation-triangle"></i><span></span></div>
        <button class="btn btn-brand w-100" id="lgBtn" type="submit"><span>Masuk</span></button>
      </form>
    </div>
    <div class="text-center mt-3 muted" style="font-size:12.5px">Warga: no. rumah + PIN &nbsp;·&nbsp; Petugas ronda: username petugas + PIN<br>Lupa PIN? Hubungi pengurus RT.</div>
    <div class="text-center mt-2"><button class="btn btn-sm btn-ghost" id="lgTheme" type="button"><i class="bi bi-moon-stars"></i> Tema</button></div>
  </div>
</section>

<!-- ============ APLIKASI ============ -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><div class="brand-mark"><i class="bi bi-wallet2"></i></div><div><b>Jimpitan RT</b><div class="muted" style="font-size:12px" id="sbRt">RT</div></div></div>
    <nav id="sbNav" aria-label="Menu utama"></nav>
    <div class="sb-foot">
      <button class="sb-link" data-act="theme"><i class="bi bi-moon-stars"></i><span>Mode gelap</span></button>
      <button class="sb-link" data-act="pin"><i class="bi bi-key"></i><span>Ganti PIN</span></button>
      <button class="sb-link" data-act="logout"><i class="bi bi-box-arrow-right"></i><span>Keluar</span></button>
    </div>
  </aside>

  <div class="wrap">
    <header class="topbar">
      <div class="brand-mark"><i class="bi bi-wallet2"></i></div>
      <div class="grow" style="flex:1;min-width:0">
        <div class="ttl" id="pgTitle">Beranda</div>
        <div class="sub" id="pgSub"></div>
      </div>
      <button class="icon-btn" id="btnRefresh" aria-label="Muat ulang"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="icon-btn" id="btnTheme" aria-label="Ganti tema"><i class="bi bi-moon-stars" id="themeIco"></i></button>
    </header>
    <div class="offline" id="offline"><i class="bi bi-wifi-off"></i> Tidak ada koneksi — data tersimpan di antrean</div>

    <main class="main" id="main">
      <section class="page" id="pg-dashboard"></section>
      <section class="page" id="pg-jimpitan"></section>
      <section class="page" id="pg-iuran"></section>
      <section class="page" id="pg-arisan"></section>
      <section class="page" id="pg-kas"></section>
      <section class="page" id="pg-tunggakan"></section>
      <section class="page" id="pg-laporan"></section>
      <section class="page" id="pg-master"></section>
      <section class="page" id="pg-pengaturan"></section>
      <section class="page" id="pg-menu"></section>
    </main>
  </div>
  <nav class="bottomnav" id="bottomNav" aria-label="Navigasi bawah"></nav>
</div>

<div id="toasts" aria-live="polite"></div>

<!-- Modal serbaguna (bottom sheet di HP) -->
<div class="modal fade sheet" id="mdl" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="mdlTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
      <div class="modal-body" id="mdlBody"></div>
      <div class="modal-footer" id="mdlFoot"></div>
    </div>
  </div>
</div>

<div id="printArea"></div>
<input type="file" id="fileBukti" accept="image/*,application/pdf" class="d-none-i">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js?v=2.3.0"></script>
<script src="js/app.js?v=2.3.0"></script>
</body>
</html>
